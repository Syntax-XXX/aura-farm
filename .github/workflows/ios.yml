# iPhone-Build für AltStore: läuft auf GitHub (macOS-Runner), Forgejo kann kein macOS.
# Ergebnis: unsignierte AuraFarm.ipa (AltStore signiert sie beim Installieren).
name: iOS (AltStore)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  ipa:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Godot + Export-Vorlagen holen
        run: |
          set -e
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip
          curl -fsSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -q tpl.tpz -d tpl
          mv tpl/templates/* "$T/"
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Xcode-Projekt exportieren
        working-directory: game
        run: |
          set -e
          "$GODOT" --headless --import >/dev/null 2>&1 || true
          mkdir -p ../build/ios
          "$GODOT" --headless --export-release iOS ../build/ios/AuraFarm.ipa
          ls ../build/ios

      - name: Ohne Signatur kompilieren und .ipa packen
        run: |
          set -e
          cd build/ios
          xcodebuild -project AuraFarm.xcodeproj -scheme AuraFarm -configuration Release -sdk iphoneos \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" build | tail -20
          APP=$(find dd/Build/Products -name "*.app" -maxdepth 2 | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr ../../AuraFarm-ios-unsigned.ipa Payload
          ls -la ../../AuraFarm-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AuraFarm-ios-unsigned
          path: AuraFarm-ios-unsigned.ipa

      - name: An GitHub-Release hängen (bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" AuraFarm-ios-unsigned.ipa --title "Aura Farm $GITHUB_REF_NAME" --notes "iPhone-Build für AltStore (unsigniert)" || gh release upload "$GITHUB_REF_NAME" AuraFarm-ios-unsigned.ipa --clobber
